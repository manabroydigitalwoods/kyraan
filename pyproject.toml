[project]
name = "kyraan"
version = "0.1.0"
description = "Kyraan — Knowledgeable Yielding Responsive Autonomous Agent Network"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    "python-telegram-bot[job-queue]>=21.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "rich>=13.0",
    "textual>=0.80.0",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

