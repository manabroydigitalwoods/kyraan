[project]
name = "kyraan"
version = "0.1.0"
description = "Kyraan — Knowledgeable Yielding Responsive Autonomous Agent Network"
# Supported band, pinned deliberately: 3.12 is the CI floor, 3.14 is the
# dev machine (mlx-whisper 0.4.x verified there). 3.11 was never exercised
# anywhere and 3.15 is unproven — widen only with a green CI leg.
requires-python = ">=3.12,<3.15"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    "python-telegram-bot[job-queue]>=21.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "rich>=13.0",
    "textual>=0.80.0",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "opencv-python>=4.10",  # local face recognition (agents/faces.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.5.0",
    "google-auth-oauthlib>=1.2",  # one-time OAuth setup flow (scripts/setup_google_oauth.py)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

