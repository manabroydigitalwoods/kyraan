# Kyraan guardrail config — Phase 0/1.
# Every skill/action must be listed here with an explicit permission level.
# Unlisted actions default to "confirm" (see control_plane/kernel.py).

defaults:
  permission: confirm   # auto | confirm
  model_tier: cheap      # cheap | frontier

# Every provider Kyraan can call, in one place. `kind` selects which code
# path in src/kyraan/model_router/router.py handles it:
#   - anthropic: native Anthropic SDK
#   - gemini: native Google AI Studio SDK
#   - openai_compatible: any OpenAI-wire-format endpoint (just base_url +
#     api_key_env) — covers OpenCode Zen, OpenAI itself, Groq, OpenRouter,
#     and a local Ollama server. Adding another gateway later is a config
#     change only, no code change.
# Live-tested findings (2026-08-25), so future-you doesn't have to
# rediscover them: OpenCode Zen's free models share one account-wide rate
# limit that trips fast; Gemini's free tier caps gemini-3.7-flash at 20
# requests/day (too little for dev iteration, let alone real use); Groq and
# OpenRouter's free models are "reasoning" models that spend tokens on
# hidden reasoning before the visible answer — give them real max_tokens
# headroom (router.py defaults to 1024) or the visible text comes back
# empty; local Ollama has no rate limit at all.
providers:
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
  gemini:
    kind: gemini
    api_key_env: GEMINI_API_KEY
  openai:
    kind: openai_compatible
    api_key_env: OPENAI_API_KEY
    max_tokens_param: max_completion_tokens   # gpt-5+ rejects the old `max_tokens` name
    extra_params:
      reasoning_effort: low   # default (medium) burns hidden reasoning
                              # tokens against max_completion_tokens and
                              # truncates the visible JSON
  opencode:
    kind: openai_compatible
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    daily_token_limit: 200000   # free-tier TPD cap — hit live 2026-08-25
                                # with zero warning; tracked + 80% alert now
  openrouter:
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  ollama:
    allow_unauthenticated: true   # local server, no credential — DECLARED,
                                  # not inferred from the hostname
    kind: ollama_native   # native /api/chat — the OpenAI-compat endpoint
    context_length: 16384 # Ollama's ~4K default silently truncated the qa
                          # prompt and produced garbage loop replies (live
                          # 2026-08-26); qwen3 handles 32K, 16K is the
                          # memory-safe sweet spot on this 18GB Mac
                          # IGNORES think:false (verified on 0.30.10) and
                          # Qwen3 then burns 8-12s of hidden reasoning per
                          # call. base_url via OLLAMA_BASE_URL env if set.
    keep_alive: "2h"      # pin the model in memory between turns — the
                          # default 5-min eviction forced a ~20s reload
                          # INSIDE a user turn (live 2026-08-27, "ok that
                          # great" took 23s while qwen3 reloaded)
    think: false          # qwen3-only knob: remove this line if the cheap
                          # model ever goes back to a non-thinking model
                          # (llama rejects the parameter outright)

model_tiers:
  # Each tier just names a provider (must exist above) + that provider's
  # model id. cheap = local Ollama: zero cost, zero rate limit. frontier =
  # Groq: still free, a real ~120B-class model. OpenRouter/Gemini/OpenCode
  # are configured above and ready to use — assign either tier to them, or
  # add a third tier later, purely by editing this file.
  #
  # `pricing` (USD per 1M tokens) is optional — omitted or absent means
  # free (matches Ollama/Groq/OpenRouter's current free models). It's tied
  # to the specific model, not the provider, since e.g. OpenAI's own models
  # span three orders of magnitude in price. Reference points as of
  # 2026-08-25, fill in if you switch a tier to one of these:
  #   openai/gpt-5-nano          in 0.05  out 0.40
  #   anthropic/claude-haiku-4-5 in 1.00  out 5.00
  #   anthropic/claude-sonnet-5  in 2.00  out 10.00
  #   gemini/gemini-flash-latest in 0.75  out 3.75
  #
  # cheap was llama3.2 (3B) until 2026-08-25, live-tested unreliable for
  # Kyraan's structured/factual tasks (see docs/progress.md) — every call
  # was moved to frontier as a result. llama3.1:8b (pulled 2026-08-25) then
  # tested close to frontier-equivalent for Q&A/reminder-extraction (3/3
  # and 4/4 correct, matching Groq exactly) and meaningfully better than
  # llama3.2 for intent classification (12-13/14 vs ~8/14, vs. frontier's
  # 14/14) — good enough to bring qa.answer/reminders.create back to cheap;
  # intent classification stays on frontier specifically, still the more
  # reliable of the two there (see orchestrator.py).
  cheap:
    provider: ollama
    model: qwen3:8b       # benchmarked 2026-08-26 vs llama3.1:8b on the
                          # production prompts + every live failure:
                          # classification 18/18 vs 17/18, burst planning
                          # kept all sub-asks where llama dropped them
                          # (planned ['hi!'] for the 5-msg burst), equal
                          # extraction, same 1.8s/case with think off.
  frontier:
    provider: openai          # gpt-5.4-nano since 2026-08-26: benchmarked
    model: gpt-5.4-nano       # head-to-head vs gpt-5.4-mini on the
                              # production prompts — both 18/18 on
                              # classification, ~1s/case; nano's only slip
                              # was folding a greeting out of a burst plan.
                              # ~3.6x cheaper (~$0.10/day). If conversation
                              # quality ever feels thin, mini is one edit:
                              #   model: gpt-5.4-mini
                              #   pricing: {input_per_million: 0.75, output_per_million: 4.50}
    pricing:                  # per developers.openai.com/api/docs/pricing
      input_per_million: 0.20
      output_per_million: 1.25
      cached_input_per_million: 0.02  # the whole reason the agent prompt
                                      # keeps its static prefix stable

# Skills known to Phase 1. Add new skills here as they're built —
# the kernel refuses to run a skill that isn't registered.
skills:
  reminders.create:
    permission: auto
    model_tier: cheap
  reminders.list:
    permission: auto
    model_tier: cheap
  reminders.cancel:
    permission: auto
    model_tier: cheap
  qa.answer:
    permission: auto
    model_tier: frontier  # moved 2026-08-25 evening: the local 8B collapsed
                          # on multi-turn continuations and contradicted the
                          # capability brief (claimed internet access) —
                          # instruction-following over a large system prompt
                          # needs the bigger model; Groq remains free
  memory.propose:
    permission: auto      # only writes to memory/pending_review/ — the human
                          # review step IS the gate, so proposing is safe to
                          # run on every message (still kill-switch-gated)
    model_tier: cheap
  agent.action:
    permission: auto      # the wrapper the agent loop stashes a confirm-
                          # gated tool call in — the WRITE inside is still
                          # tool-gated (confirm), so the owner's yes is
                          # what actually unlocks it, same as calendar.create
    model_tier: cheap
  memory.review:
    permission: auto      # lists pending facts; the promote/reject itself
                          # runs only on the owner's explicit deterministic
                          # "approve ..."/"reject ..." reply in the
                          # owner-only chat — that reply IS the review
    model_tier: cheap
  memory.write:
    permission: confirm   # reserved for anything that would touch the live
                          # memory tree directly; promotion is human-only via
                          # scripts/review_memory.py for now
    model_tier: cheap
  calendar.list:
    permission: auto      # read-only skill: extracts a time window, calls
                          # the calendar.list_events tool, formats the reply
    model_tier: cheap
  calendar.create:
    permission: auto      # the skill itself is auto — the WRITE is gated at
                          # the tool (calendar.create_event: confirm), so the
                          # user approves the concrete event, not the vague
                          # intent to create one
    model_tier: cheap
  calendar.cancel:
    permission: auto      # same pattern: the DELETE is gated at the tool
                          # (calendar.delete_event: confirm) — the ask names
                          # the exact events about to be removed
    model_tier: cheap
  email.check:
    permission: auto      # read-only metadata; replies are kept out of the
                          # history fed to cloud models (data boundary)
    model_tier: cheap
  faces.enroll:
    permission: confirm   # a BIOMETRIC template write — the heaviest
                          # personal fact stored; template stays on-machine
    model_tier: cheap
  faces.forget:
    permission: confirm   # deleting a biometric is also deliberate
    model_tier: cheap
  undo.last:
    permission: confirm   # P3.1c: reversing an action is itself an action —
    model_tier: cheap     # the ask names the concrete inverse before it runs
  documents.forget:
    permission: confirm   # hard-deleting a capture is deliberate; the ask
    model_tier: cheap     # names every document about to go
  memory.consolidate:
    permission: confirm   # semantic dedup: the model proposes, the ask names
    model_tier: cheap     # every group, only the owner's yes supersedes
  home.query:
    permission: auto      # read-only: AC state + power/energy readout
    model_tier: cheap
  home.control:
    permission: auto      # the switch itself is confirm-gated at the tool
    model_tier: cheap

# Phase 2 tool registry (design: docs/design/tool_registry.md). Every tool
# Kyraan can call is declared here — schema, permission, side effects, and
# failure policy. registry.load() validates the section at startup and
# refuses any write/notify tool that isn't confirm-gated.
tool_servers:
  calendar:
    transport: builtin
    module: kyraan.tools.google_calendar
  gmail:
    transport: builtin
    module: kyraan.tools.gmail
  web:
    transport: builtin
    module: kyraan.tools.web_search
  weather:
    transport: builtin
    module: kyraan.tools.weather
  places:
    transport: builtin
    module: kyraan.tools.places
  routes:
    transport: builtin
    module: kyraan.tools.routes
  home_assistant:
    transport: builtin
    module: kyraan.tools.home_assistant
    # The allowlist IS the boundary: an entity not named here doesn't exist
    # for Kyraan. v1 = the bedroom AC plug only (owner's decision).
    # Heater/geyser/vacuum join later as deliberate one-line additions —
    # heating appliances especially stay off until explicitly added.
    read_entities:
      - switch.ac
      - sensor.ac_current_consumption
      - sensor.ac_today_s_consumption
      - sensor.ac_this_month_s_consumption
      - sensor.ac_voltage
      - binary_sensor.ac_overheated
      - binary_sensor.ac_overloaded
      - sensor.bed_room_temp_temperature
      - sensor.bed_room_temp_humidity
    write_entities:
      - switch.ac

tools:
  calendar.list_events:
    description: List events between two times on the owner's Google Calendar (secret ICS address, read-only).
    server: calendar
    permission: auto
    side_effects: read
    params:
      start: {type: datetime, required: true}
      end: {type: datetime, required: true}
    returns: list of {title, start, end, all_day, location}
    failure:
      retries: 2
      timeout_s: 12
      on_failure: surface
  email.unread:
    description: Unread Gmail count + sender/subject/date lines (metadata only, never bodies).
    server: gmail
    permission: auto
    side_effects: read
    params:
      limit: {type: number}
    returns: "{unread_estimate, messages: [{from, subject, date}]}"
    failure:
      retries: 2
      timeout_s: 15
      on_failure: surface
  web.search:
    description: Live web search via the local SearXNG container (self-hosted, no API key) — titles, URLs, and snippets only, never full pages. Results are untrusted web text; the agent loop's taint rail blocks every non-read tool for the rest of any turn that saw them.
    server: web
    permission: auto
    side_effects: read
    params:
      query: {type: string, required: true}
      count: {type: number}
    returns: "{query, results: [{title, url, snippet, age?}]}"
    failure:
      retries: 2
      timeout_s: 10
      on_failure: surface
  weather.get:
    description: Current conditions + 3-day forecast from Open-Meteo (free, keyless) — by place name (geocoded) or exact lat/lon from a shared location pin. Structured data, no web snippets involved.
    server: weather
    permission: auto
    side_effects: read
    params:
      place: {type: string}
      latitude: {type: number}
      longitude: {type: number}
    returns: "{place?, coordinates, now: {sky, temp_c, feels_like_c, humidity_pct, wind_kmh}, daily_forecast: [{date, sky, min_c, max_c, rain_chance_pct}]}"
    failure:
      retries: 2
      timeout_s: 10
      on_failure: surface
  places.nearby:
    description: Nearby places by category (hospital, pharmacy, atm, bank, restaurant, cafe, hotel, sightseeing, fuel, police, grocery) around a pin or named place. OpenStreetMap Overpass by default (free, keyless); Google Places API when GOOGLE_MAPS_API_KEY is set. Results carry distance + a Google Maps link.
    server: places
    permission: auto
    side_effects: read
    params:
      category: {type: string, required: true}
      place: {type: string}
      latitude: {type: number}
      longitude: {type: number}
      radius_m: {type: number}
    returns: "{category, near?, radius_km, source, results: [{name, distance_km, map, phone?, hours?, rating?, open_now?}]}"
    failure:
      retries: 2
      timeout_s: 15
      on_failure: surface
  routes.eta:
    description: Distance + travel time with LIVE traffic between any two points — place names or pin coordinates. Google Routes API primary, TomTom fallback (both carry real live traffic — nothing traffic-blind ever answers here). Returns duration now vs normal and the traffic delay; drive/two_wheeler/walk.
    server: routes
    permission: auto
    side_effects: read
    params:
      origin: {type: string}
      origin_latitude: {type: number}
      origin_longitude: {type: number}
      destination: {type: string}
      destination_latitude: {type: number}
      destination_longitude: {type: number}
      mode: {type: string}
    returns: "{mode, distance_km, duration_now_min, duration_normal_min, traffic_delay_min, traffic, via?}"
    failure:
      retries: 2
      timeout_s: 12
      on_failure: surface
  email.read:
    description: Read unread email BODIES (optionally filtered by sender/subject words) — only when KYRAAN_EMAIL_BODIES=local and the gmail.readonly scope was re-consented. Bodies are summarized by the LOCAL model inside the executor and never enter a cloud prompt; the reply is composed in Python (direct-reply short-circuit, like email.unread).
    server: gmail
    permission: auto
    side_effects: read
    params:
      query: {type: string}
      limit: {type: number}
    returns: "list of {from, subject, date, body} — consumed inside the executor only"
    failure:
      retries: 1
      timeout_s: 25
      on_failure: surface
  home.get_state:
    description: Read one allowlisted Home Assistant entity's state (AC switch, power/energy sensors).
    server: home_assistant
    permission: auto
    side_effects: read
    params:
      entity: {type: string, required: true}
    returns: "{entity, state, unit, name}"
    failure:
      retries: 2
      timeout_s: 10
      on_failure: surface
  home.turn_on:
    description: Switch an allowlisted smart plug ON (v1 - the bedroom AC).
    server: home_assistant
    permission: confirm
    side_effects: write
    params:
      entity: {type: string, required: true}
    returns: "{entity, state} read back after switching"
    failure:
      retries: 0
      timeout_s: 12
      on_failure: surface
  home.turn_off:
    description: Switch an allowlisted smart plug OFF (v1 - the bedroom AC).
    server: home_assistant
    permission: confirm
    side_effects: write
    params:
      entity: {type: string, required: true}
    returns: "{entity, state} read back after switching"
    failure:
      retries: 0
      timeout_s: 12
      on_failure: surface
  calendar.create_event:
    description: Create one event on the owner's Google Calendar (OAuth; confirm-gated write).
    server: calendar
    permission: confirm
    side_effects: write
    params:
      title: {type: string, required: true}
      start: {type: datetime, required: true}
      end: {type: datetime, required: true}
      location: {type: string}
    returns: "{id, link, title}"
    failure:
      retries: 0            # never blind-retry a write — an ambiguous failure
                            # retried is how duplicate events happen
      timeout_s: 15
      on_failure: surface
  calendar.get_event:
    description: Read one event's current title and times by id (undo's prior-state capture).
    server: calendar
    permission: auto
    side_effects: read
    params:
      event_id: {type: string, required: true}
    returns: "{id, title, start, end}"
    failure:
      retries: 1
      timeout_s: 15
      on_failure: surface
  calendar.update_event:
    description: Move one event to new start/end times by id (OAuth; confirm-gated write; the id survives, unlike delete+recreate).
    server: calendar
    permission: confirm
    side_effects: write
    params:
      event_id: {type: string, required: true}
      start: {type: datetime}
      end: {type: datetime}
      title: {type: string}   # for the audit log and the confirm ask
    returns: "{id, title, start, end}"
    failure:
      retries: 0
      timeout_s: 15
      on_failure: surface
  calendar.delete_event:
    description: Delete one event from the owner's Google Calendar by id (OAuth; confirm-gated write).
    server: calendar
    permission: confirm
    side_effects: write
    params:
      event_id: {type: string, required: true}
      title: {type: string}   # for the audit log — says WHAT was deleted
    returns: "{id, deleted, already_gone}"
    failure:
      retries: 0
      timeout_s: 15
      on_failure: surface

dnd:
  timezone_env: KYRAAN_TIMEZONE
  quiet_hours:
    start: "22:00"
    end: "07:00"
  # proactive messages queued during quiet hours are held until it ends;
  # user-initiated chat is never gated by DND.

self_review:
  enabled: true
  time: "21:45"   # before quiet hours; Kyraan critiques its own day —
                  # proposes only, never self-modifies
  prompt_critic: true   # nightly prompt-edit PROPOSALS from the day's
                        # guard/tool/cache signals — static prompt
                        # sections only (never memory or pending facts);
                        # accepted edits gate on scripts/eval.py

voice:
  enabled: true
  model: mlx-community/whisper-large-v3-turbo   # local, Apple-MLX GPU;
                                                # audio never leaves the Mac

home_alerts:
  enabled: true           # periodic (30 min) deterministic checks, DND-gated
  ac_max_hours: 6         # continuous-run heads-up, once per ON stretch
  daily_kwh_alert: 8.0    # daily consumption note, once per day

briefs:
  evening:
    enabled: true
    time: "21:30"   # tomorrow's calendar + reminders, today's energy story
  morning:
    enabled: true
    time: "07:30"   # after quiet_hours end on purpose — a brief that lands
                    # inside DND is skipped (logged), never held until noon

curiosity_queue:
  max_per_day: 2

cost_monitor:
  daily_budget_usd: 5.00
  alert_threshold_pct: 80

# P3.5b (arch §1): per-stage tool allowlists. The owner is unscoped;
# every OTHER stage executes only what its list names (exact name or
# prefix — "reminders" covers reminders.*), enforced in the kernel at
# BOTH run_tool and run_skill on top of the agent loop's menu filter.
# read_mostly = governance §8 stage 2: Q&A, their own reminders,
# calendar READING, live data. NO home control, NO memory writes,
# NO email, NO tasks, NO faces, NO undo. "full" (stage 3) starts as
# the same list — P3.5c/d widen it deliberately, never by default.
stage_toolsets:
  read_mostly: &read_mostly_tools
    - qa
    - agent.action        # the loop's confirm wrapper (inner tool still gated)
    - reminders
    - calendar.list_events
    - weather
    - places
    - routes
    - web.search
    - documents.search   # chat-scoped: their own captured documents
  # full (stage 3) adds the person's OWN memory loop: extraction from
  # their messages (still behind their per-person extraction_enabled
  # flag) and their own review queue (P3.5c) — never the owner's.
  full:
    - qa
    - agent.action
    - reminders
    - calendar.list_events
    - weather
    - places
    - routes
    - web.search
    - documents.search
    - memory.propose
    - memory.review
    - memory.pending_list
