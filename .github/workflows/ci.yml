# CI (plan §7 item 5, built 2026-08-31): every push runs the full suite
# against real Postgres (pgvector) + Redis with migrations applied — the
# pg-marked tests run for real here instead of auto-skipping.
#
# TZ is America/New_York on purpose: conftest pins the APP zone to UTC,
# so a non-UTC host proves nothing leans on the system zone (the
# suite's own documented intent).
#
# The eval gate (scripts/eval.py) does NOT run here — it needs the live
# model tiers and the owner's keys; it remains the local deploy gate.
name: suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
      KYRAAN_PG_DSN: postgresql://kyraan:kyraan@127.0.0.1:5432/kyraan
      KYRAAN_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kyraan
          POSTGRES_PASSWORD: kyraan
          POSTGRES_DB: kyraan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kyraan"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            echo "== $f"
            psql "$KYRAAN_PG_DSN" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install
        run: pip install -q -e ".[dev]"

      - name: Run suite
        run: python -m pytest -q
