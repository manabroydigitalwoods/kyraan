# CI: the full suite on every push/PR. Tests fake all providers and the
# conftest isolates every data store, so no secrets are needed here —
# a leaked-secret surface of zero is deliberate.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          KYRAAN_TIMEZONE: Asia/Kolkata
