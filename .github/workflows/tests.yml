# CI: the full suite on every push/PR. Tests fake all providers and the
# conftest isolates every data store, so no secrets are needed here —
# a leaked-secret surface of zero is deliberate.
#
# The matrix pins the supported runtime band (3.12 = CI floor, 3.14 = the
# dev machine) and runs one leg under a hostile non-UTC host timezone:
# conftest pins KYRAAN_TIMEZONE itself, so a green run here proves the
# suite is timezone-independent, not just lucky on UTC runners.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # P3.0c: the pg-marked store tests run against real service containers
  # on this one job; every other leg auto-skips them. The tail grep makes
  # a skip loud — "green because skipped" must not count as executed.
  pytest-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kyraan
          POSTGRES_USER: kyraan
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kyraan -d kyraan"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KYRAAN_PG_DSN: postgresql://kyraan:ci-only@127.0.0.1:5432/kyraan
      KYRAAN_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/migrate.py
      - name: pg-marked tests must EXECUTE, not skip
        run: |
          pytest -m pg -q -rs | tee pg-tests.out
          ! grep -qi "skipped" pg-tests.out

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            tz: "UTC"
          - python-version: "3.14"
            tz: "America/New_York"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          TZ: ${{ matrix.tz }}
